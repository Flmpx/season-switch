<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>场景设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <h1>季节轮转</h1>
        <nav class="tab-bar">
          <button class="tab-btn active" data-tab="season">季节</button>
          <button class="tab-btn" data-tab="time">时间</button>
          <button class="tab-btn" data-tab="display">显示程度</button>
          <button class="tab-btn" data-tab="particle">粒子</button>
        </nav>
      </header>

      <main class="popup-body">
        <!-- 季节 -->
        <section class="setting-section tab-panel active" data-panel="season">
          <h2 class="section-title">季节</h2>
          <div class="option-grid" data-key="season">
            <button class="option-btn" data-value="spring">春</button>
            <button class="option-btn" data-value="summer">夏</button>
            <button class="option-btn" data-value="autumn">秋</button>
            <button class="option-btn" data-value="winter">冬</button>
            <button class="option-btn" data-value="custom-season">自定义</button>
            <button class="option-btn" data-value="system-season">跟随系统</button>
          </div>
          <div class="custom-row" id="customMonthRow" style="display:none;">
            <input
              type="range"
              id="customMonthSlider"
              min="1"
              max="12"
              value="6"
              class="intensity-slider"
            />
            <span id="customMonthValue" class="intensity-value">6月</span>
          </div>
        </section>

        <!-- 时间 -->
        <section class="setting-section tab-panel" data-panel="time">
          <h2 class="section-title">时间</h2>
          <div class="option-grid" data-key="timeOfDay">
            <button class="option-btn" data-value="dawn">清晨</button>
            <button class="option-btn" data-value="morning">上午</button>
            <button class="option-btn" data-value="noon">中午</button>
            <button class="option-btn" data-value="afternoon">下午</button>
            <button class="option-btn" data-value="dusk">傍晚</button>
            <button class="option-btn" data-value="evening">晚上</button>
            <button class="option-btn" data-value="midnight">深夜</button>
            <button class="option-btn" data-value="custom-time">自定义</button>
            <button class="option-btn" data-value="system-time">跟随系统</button>
          </div>
          <div class="custom-row" id="customHourRow" style="display:none;">
            <input
              type="range"
              id="customHourSlider"
              min="0"
              max="23"
              value="12"
              class="intensity-slider"
            />
            <span id="customHourValue" class="intensity-value">12时</span>
          </div>
        </section>

        <!-- 显示程度 -->
        <section class="setting-section tab-panel" data-panel="display">
          <h2 class="section-title">显示程度</h2>
          <div class="option-grid" data-key="intensity">
            <button class="option-btn" data-value="misty">朦朦</button>
            <button class="option-btn" data-value="light">浅</button>
            <button class="option-btn" data-value="medium">中</button>
            <button class="option-btn" data-value="deep">深</button>
            <button class="option-btn" data-value="custom-intensity">自定义</button>
          </div>
          <div class="custom-intensity-row" id="customIntensityRow" style="display:none;">
            <input
              type="range"
              id="customIntensitySlider"
              min="0"
              max="100"
              value="50"
              class="intensity-slider"
            />
            <span id="customIntensityValue" class="intensity-value">50%</span>
          </div>
        </section>

        <!-- 粒子 -->
        <section class="setting-section tab-panel" data-panel="particle">
          <h2 class="section-title">粒子</h2>

          <!-- 🍃 叶子 -->
          <div class="element-setting">
            <h3 class="element-title">🍃 叶子</h3>

            <div class="sub-setting">
              <h4 class="sub-title">速度</h4>
              <div class="option-grid" data-element="leaf" data-prop="speed">
                <button class="option-btn" data-value="slow">慢</button>
                <button class="option-btn" data-value="normal">中</button>
                <button class="option-btn" data-value="fast">快</button>
                <button class="option-btn" data-value="custom-speed">自定义</button>
              </div>
              <div class="custom-row" data-element="leaf" data-prop="speed" data-unit="%" style="display:none;">
                <input type="range" id="leaf-speed-slider" min="0" max="100" value="50" class="intensity-slider" />
                <span id="leaf-speed-value" class="intensity-value">50%</span>
              </div>
            </div>

            <div class="sub-setting">
              <h4 class="sub-title">大小</h4>
              <div class="option-grid" data-element="leaf" data-prop="size">
                <button class="option-btn" data-value="small">小</button>
                <button class="option-btn" data-value="medium">中</button>
                <button class="option-btn" data-value="large">大</button>
                <button class="option-btn" data-value="custom-size">自定义</button>
              </div>
              <div class="custom-row" data-element="leaf" data-prop="size" data-unit="%" style="display:none;">
                <input type="range" id="leaf-size-slider" min="0" max="100" value="50" class="intensity-slider" />
                <span id="leaf-size-value" class="intensity-value">50%</span>
              </div>
            </div>

            <div class="sub-setting">
              <h4 class="sub-title">数目</h4>
              <div class="option-grid" data-element="leaf" data-prop="count">
                <button class="option-btn" data-value="minimal">微量</button>
                <button class="option-btn" data-value="few">少量</button>
                <button class="option-btn" data-value="medium">中等</button>
                <button class="option-btn" data-value="heavy">大量</button>
                <button class="option-btn" data-value="custom-count">自定义</button>
              </div>
              <div class="custom-row" data-element="leaf" data-prop="count" data-unit="个/分钟" style="display:none;">
                <input type="range" id="leaf-count-slider" min="10" max="1800" value="50" class="intensity-slider" />
                <span id="leaf-count-value" class="intensity-value">50个/分钟</span>
              </div>
            </div>
          </div>

          <!-- ❄️ 雪花 -->
          <div class="element-setting">
            <h3 class="element-title">❄️ 雪花</h3>

            <div class="sub-setting">
              <h4 class="sub-title">速度</h4>
              <div class="option-grid" data-element="snow" data-prop="speed">
                <button class="option-btn" data-value="slow">慢</button>
                <button class="option-btn" data-value="normal">中</button>
                <button class="option-btn" data-value="fast">快</button>
                <button class="option-btn" data-value="custom-speed">自定义</button>
              </div>
              <div class="custom-row" data-element="snow" data-prop="speed" data-unit="%" style="display:none;">
                <input type="range" id="snow-speed-slider" min="0" max="100" value="50" class="intensity-slider" />
                <span id="snow-speed-value" class="intensity-value">50%</span>
              </div>
            </div>

            <div class="sub-setting">
              <h4 class="sub-title">大小</h4>
              <div class="option-grid" data-element="snow" data-prop="size">
                <button class="option-btn" data-value="small">小</button>
                <button class="option-btn" data-value="medium">中</button>
                <button class="option-btn" data-value="large">大</button>
                <button class="option-btn" data-value="custom-size">自定义</button>
              </div>
              <div class="custom-row" data-element="snow" data-prop="size" data-unit="%" style="display:none;">
                <input type="range" id="snow-size-slider" min="0" max="100" value="50" class="intensity-slider" />
                <span id="snow-size-value" class="intensity-value">50%</span>
              </div>
            </div>

            <div class="sub-setting">
              <h4 class="sub-title">数目</h4>
              <div class="option-grid" data-element="snow" data-prop="count">
                <button class="option-btn" data-value="minimal">微量</button>
                <button class="option-btn" data-value="few">少量</button>
                <button class="option-btn" data-value="medium">中等</button>
                <button class="option-btn" data-value="heavy">大量</button>
                <button class="option-btn" data-value="custom-count">自定义</button>
              </div>
              <div class="custom-row" data-element="snow" data-prop="count" data-unit="个/分钟" style="display:none;">
                <input type="range" id="snow-count-slider" min="10" max="1800" value="50" class="intensity-slider" />
                <span id="snow-count-value" class="intensity-value">50个/分钟</span>
              </div>
            </div>
          </div>

          <!-- ⭐ 星光（静止，无速度项） -->
          <div class="element-setting">
            <h3 class="element-title">⭐ 星光</h3>

            <div class="sub-setting">
              <h4 class="sub-title">大小</h4>
              <div class="option-grid" data-element="star" data-prop="size">
                <button class="option-btn" data-value="small">小</button>
                <button class="option-btn" data-value="medium">中</button>
                <button class="option-btn" data-value="large">大</button>
                <button class="option-btn" data-value="custom-size">自定义</button>
              </div>
              <div class="custom-row" data-element="star" data-prop="size" data-unit="%" style="display:none;">
                <input type="range" id="star-size-slider" min="0" max="100" value="50" class="intensity-slider" />
                <span id="star-size-value" class="intensity-value">50%</span>
              </div>
            </div>

            <div class="sub-setting">
              <h4 class="sub-title">数目</h4>
              <div class="option-grid" data-element="star" data-prop="count">
                <button class="option-btn" data-value="minimal">微量</button>
                <button class="option-btn" data-value="few">少量</button>
                <button class="option-btn" data-value="medium">中等</button>
                <button class="option-btn" data-value="heavy">大量</button>
                <button class="option-btn" data-value="custom-count">自定义</button>
              </div>
              <div class="custom-row" data-element="star" data-prop="count" data-unit="个" style="display:none;">
                <input type="range" id="star-count-slider" min="10" max="150" value="60" class="intensity-slider" />
                <span id="star-count-value" class="intensity-value">60个</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
